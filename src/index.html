<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RTCalc - Calculadora cientifica con esteroides</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-layout">
        <div id="tape-container" class="tape-container">
            
        </div>

        <div class="input-panel">
            <span class="prompt">&gt;</span>
            <input type="text" id="calc-input" placeholder="Ej: x^2 - 4, sin(x) o x^2 - y^2 (3D)" autofocus autocomplete="off" spellcheck="false">
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
